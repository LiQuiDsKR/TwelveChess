<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>십이장기 - 플레이</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-wrapper">
    <div id="info-panel">
      <h2>십이장기 멀티플레이</h2>
      <p>플레이어: <span id="player-name">-</span></p>
      <p>상대방: <span id="opponent-name">-</span></p>
      <p>현재 턴: <span id="turn-display">-</span></p>
      <p id="message">잠시만 기다려주세요...</p>
      <div id="captured-container">
        <div>
          <h4>내가 잡은 기물</h4>
          <div id="my-captured" class="captured-box"></div>
        </div>
        <div>
          <h4>상대가 잡은 기물</h4>
          <div id="opponent-captured" class="captured-box"></div>
        </div>
      </div>
      <button id="restart-btn" style="display: none;">다시하기</button>
    </div>

    <div id="board"></div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
